name: "Vortex CI — AST Impact, Lint, Type Check, Surgical Tests, Nemesis & Specter Audit"

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Dogfooding Vortex: Analyze AST Blast Radius & Generate LPT Matrix
  vortex-brain:
    name: "⚡ Vortex AST Impact & LPT Sharding"
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.vortex.outputs.should-run }}
      execution_mode: ${{ steps.vortex.outputs.execution-mode }}
      matrix: ${{ steps.vortex.outputs.matrix }}
      nemesis_files: ${{ steps.vortex.outputs.nemesis-target-files }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Deno 2
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify Formatting, Linter & Strict Type Check
        run: |
          deno fmt --check
          deno lint
          deno task check

      - name: Run Vortex AST Impact Engine (Self-Analysis)
        id: vortex
        uses: ./
        with:
          shards: "2"
          base-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD~1' }}
          head-ref: "HEAD"

  # 2. Execute Surgical Shards Dynamically Balanced by Vortex LPT
  surgical-tests:
    name: "🧪 Surgical Shard (${{ matrix.shard_id }}/${{ matrix.shard_total }})"
    needs: vortex-brain
    if: needs.vortex-brain.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.vortex-brain.outputs.matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Deno 2
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Execute Assigned Test Suites
        shell: bash
        env:
          VORTEX_SHARD_FILES: ${{ matrix.test_files }}
        run: |
          read -r -a TEST_FILES <<< "$VORTEX_SHARD_FILES"
          deno test --allow-read --allow-write --allow-env --allow-run=git "${TEST_FILES[@]}"

  # 3. Companion Ecosystem Audit: glastor-core/nemesis DevSecOps & SBOM
  nemesis-devsecops:
    name: "🛡️ Nemesis DevSecOps & CycloneDX SBOM Audit"
    needs: vortex-brain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run GLASTOR® Core Nemesis Auditor
        uses: glastor-core/nemesis@v1
        with:
          scan-secrets: "true"
          scan-hygiene: "true"
          scan-licenses: "true"
          generate-sbom: "true"
          scan-sast: "false"
          scan-sca: "false"

  # 4. Companion Ecosystem Audit: glastor-core/specter AST API Contract & SemVer Gatekeeper
  specter-contract-guard:
    name: "👻 Specter AST API Contract & SemVer Gatekeeper"
    needs: vortex-brain
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Repository (Full History for Base Ref Diff)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run GLASTOR® Core Specter API Contract Auditor
        uses: glastor-core/specter@v1
        with:
          head-dir: "src"
          base-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD~1' }}
          fail-on-trojan: "true"
          fail-on-breaking: "false"
          output-json: "specter-report.json"
          output-sbom: "specter-contract.sbom.json"
          post-pr-comment: "true"

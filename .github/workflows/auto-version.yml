name: "Auto Semantic Version & Floating v1 Tag"

on:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

concurrency:
  group: release-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag-release:
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Deno 2
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Sync Semantic Tag & Floating v1 Marketplace Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION=$(deno eval "import denoJson from './deno.json' with { type: 'json' }; console.log(denoJson.version);")
          git tag -fa "v${VERSION}" -m "Release v${VERSION}"
          git tag -fa "v1" -m "Floating major tag v1 -> v${VERSION}"
          git push origin "v${VERSION}" "v1" --force

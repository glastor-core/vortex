name: "Multi-Platform Binary Release & SHA-256 Checksums"

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: "📦 Compile Standalone Binaries & Publish SHA256SUMS"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Deno 2
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Compile Standalone Multi-Platform Binaries
        run: |
          mkdir -p dist
          deno task compile:linux
          deno task compile:windows
          deno task compile:macos
          deno task compile:macos-arm

      - name: Generate Cryptographic SHA-256 Checksums
        working-directory: dist
        run: |
          sha256sum vortex-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach Binaries & Checksums to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/vortex-* dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG_NAME" dist/vortex-* dist/SHA256SUMS.txt \
              --title "Vortex $TAG_NAME" \
              --generate-notes
          fi
